# Prefix
set-option -g prefix C-a
bind C-a send-prefix

# Terminal
set-option -sa terminal-overrides ",xterm*:Tc"
set -as terminal-features ",*:hyperlinks"
set -g default-terminal "xterm-256color"

# General
set -g base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
set -g history-limit 1000000
set -g mouse on
set -g allow-passthrough on
set -g aggressive-resize on
set -g detach-on-destroy off
set -sg escape-time 0
setw -g mode-keys vi

# Splits (preserve path)
bind "'" split-window -h -c "#{pane_current_path}"
bind ';' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Prefix bindings
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."
bind e setw synchronize-panes
bind C-v split-window 'tmux capture-pane -t:.- -Jp -S- | nvim -'
bind j switch-client -l
bind k last-window
bind -r h swap-window -d -t -1
bind -r l swap-window -d -t +1
bind m command-prompt -p "Pane name:" "select-pane -T '%%'"
bind q switch-client -T kill
bind -T kill q kill-window
bind-key -r -T prefix S-Up resize-pane -U
bind-key -r -T prefix S-Down resize-pane -D
bind-key -r -T prefix S-Left resize-pane -L
bind-key -r -T prefix S-Right resize-pane -R

# Prefix-less bindings
bind-key -n M-h previous-window
bind-key -n M-l next-window
bind-key -n M-j select-pane -t :.+
bind-key -n M-k select-pane -t :.-
bind-key -n M-g new-window
# Sessions: Shift mirrors M-h/M-l one level up (session instead of window).
# Cycles in the same order the M-s picker lists sessions (creation order) —
# switch-client -n/-p would go alphabetically instead. See session-cycle.sh.
bind-key -n M-H run-shell "~/.config/tmux/session-cycle.sh prev '#{client_name}'"
bind-key -n M-L run-shell "~/.config/tmux/session-cycle.sh next '#{client_name}'"
bind-key -n 'M-[' copy-mode
bind-key -n 'M-:' command-prompt
bind-key -n M-z resize-pane -Z
bind-key -n M-s choose-tree -Zs
# Fuzzy-search the scrollback of every pane in every session and jump to the
# match. Complements M-s (pick a session by name) and prefix f (find-window,
# which only glob-matches visible text and lands on a window, not a pane).
bind-key -n M-/ display-popup -E -w 90% -h 85% "~/.config/tmux/pane-search.sh"
bind-key -n "M-'" split-window -h -c "#{pane_current_path}"
bind-key -n 'M-;' split-window -v -c "#{pane_current_path}"

# Jump between prompts in the scrollback (Claude Code messages or shell prompts).
# Matches a line starting with "❯ " then text — i.e. a submitted prompt — and skips
# the empty input box, inline "❯", and indented "❯" inside output. M-p = previous
# (older), M-n = next (newer). Repeat to keep jumping; q exits copy-mode. Works both
# from normal mode (enters copy-mode) and while already in copy-mode.
bind-key -n M-p copy-mode \; send-keys -X search-backward "^❯ [^ ]"
bind-key -n M-n copy-mode \; send-keys -X search-forward  "^❯ [^ ]"
bind-key -T copy-mode-vi M-p send-keys -X search-backward "^❯ [^ ]"
bind-key -T copy-mode-vi M-n send-keys -X search-forward  "^❯ [^ ]"

# Copy mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-selection
bind-key -T copy-mode-vi H send-keys -X -N 7 cursor-up
bind-key -T copy-mode-vi L send-keys -X -N 7 cursor-down
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.1 \; send-keys -X copy-pipe-no-clear
bind-key -T copy-mode-vi WheelUpPane send-keys -X clear-selection \; send-keys -X -N 5 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X clear-selection \; send-keys -X -N 5 scroll-down

# MacOS keys
bind-key -n Home send Escape "[1~"
bind-key -n End send Escape "[4~"
bind-key -n PPage send Escape "[5~"
bind-key -n NPage send Escape "[6~"

# Synchronized panes indicator
set-option -gw window-status-current-format '#{?pane_synchronized,#[fg=red]@@@#[default],}#I:#W#F#{?pane_synchronized,#[fg=red]@@@#[default],}'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_action 'copy-pipe'

# Session persistence. resurrect saves the session/window/pane tree (names,
# layout, cwds); continuum wraps it with an autosave timer and restore-on-start,
# so a forced reboot costs at most @continuum-save-interval minutes.
# resurrect must be listed before continuum.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
# Relaunch nothing. Panes come back as plain shells in the right cwd, holding
# their scrollback; 'false' also suppresses resurrect's default vim/less/top list.
set -g @resurrect-processes 'false'

# Catppuccin theme
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_date_time_text " %d/%m %H:%M"
set -g @catppuccin_directory_text "#{pane_current_path}"
# catppuccin v2 dropped @catppuccin_status_modules_*; status lines are composed
# from module variables. Set before TPM runs so continuum can hook status-right
# (#{E:} expands at draw time, so the modules needn't be loaded yet).
set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_session}#{E:@catppuccin_status_date_time}"
set-environment -g LC_ALL en_US.UTF-8
set-environment -g LC_TIME en_US.UTF-8

# TPM auto-install and initialize
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'

# Post-plugin overrides (catppuccin/tmux-yank override these)
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi y send-keys -X copy-pipe "~/.config/tmux/yank-joined.sh | pbcopy"
bind , set-option -w automatic-rename off \; command-prompt -I "#W" "rename-window '%%'"
bind -n M-, set-option -w automatic-rename off \; command-prompt -I "#W" "rename-window '%%'"
bind -n M-m command-prompt -p "Pane name:" "select-pane -T '%%'"
bind -n M-. command-prompt -I "#S" "rename-session '%%'"

# Pane borders (after plugins to override catppuccin)
set -g pane-border-lines double
set -g pane-border-indicators arrows
set -g pane-border-style 'fg=#444444'
set -g pane-active-border-style 'fg=#fab387,bold'
set -g pane-border-status top
set -g pane-border-format ' #[bold]#{?pane_active,#[fg=#fab387]●,#[fg=#444444]○}#[default] #P: #{?#{==:#{pane_title},#{host}},#{b:pane_current_path},#{pane_title}} '
set -g mode-style "fg=#cdd6f4,bg=#585b70"

# Re-enable Claude Code Remote Control in panes where it gave up retrying
run-shell -b "~/.config/tmux/rc-watchdog.sh"
